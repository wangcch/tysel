site_name: Tysel Documentation
site_description: A lightweight native TypeScript runtime for services and AI agents.
site_url: https://tysel.dev/docs/
docs_dir: docs
repo_name: wangcch/tysel
repo_url: https://github.com/wangcch/tysel
edit_uri: edit/main/docs/
strict: true
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
exclude_docs: |
  website-plan.md
  documentation-roadmap.md
theme:
  name: readthedocs
plugins:
  - search
nav:
  - Home: index.md
  - Get started:
      - Installation: install.md
      - First service: getting-started.md
  - Guides:
      - Choose a guide: guides/index.md
      - Example gallery: guides/examples.md
      - Service networking: guides/service-networking.md
      - Concurrency and backpressure: guides/concurrency-backpressure.md
      - Cron and Queue: guides/cron-queue.md
      - LLM gateway: guides/llm-gateway.md
      - Filesystem: guides/filesystem.md
      - SQLite: guides/sqlite.md
      - PostgreSQL: guides/postgresql.md
      - Redis: guides/redis.md
      - Container image: guides/container-image.md
      - Observability: guides/observability.md
      - Debugging: guides/debugging.md
      - Reproducible release: guides/reproducible-release.md
      - Rust Wasm Component: guides/wasm-component-rust.md
      - Go Wasm Component: guides/wasm-component-go.md
  - Learn:
      - How Tysel works: concepts/how-tysel-works.md
      - Projects and configuration: concepts/projects-and-configuration.md
      - Execution profiles: concepts/execution-profiles.md
      - Durable execution: concepts/durable-execution.md
  - Reference:
      - Overview: reference/index.md
      - CLI:
          - Overview: reference/cli/index.md
          - Project and configuration: reference/cli/project.md
          - Develop and test: reference/cli/development.md
          - Tasks and protocols: reference/cli/tasks.md
          - Build and image: reference/cli/delivery.md
          - Installation lifecycle: reference/cli/installation.md
          - Benchmarks and release: reference/cli/evidence.md
      - Manifest:
          - Overview: reference/manifest/index.md
          - Application and server: reference/manifest/app-server.md
          - Permissions: reference/manifest/permissions.md
          - Limits: reference/manifest/limits.md
          - Durable and observability: reference/manifest/durable-observability.md
          - Tasks: reference/manifest/tasks.md
      - Runtime:
          - Overview: reference/runtime/index.md
          - Core types: reference/runtime/types.md
          - Application module: reference/runtime/application.md
          - Host capabilities: reference/runtime/capabilities.md
          - Durable API: reference/runtime/durable.md
          - Testing API: reference/runtime/testing.md
      - Wasm Components:
          - Overview: reference/component/index.md
          - Component ABI: reference/component/abi.md
          - Runtime and WASI: reference/component/runtime.md
          - Capabilities: reference/component/capabilities.md
          - Rust SDK: reference/component/rust-sdk.md
          - Go SDK: reference/component/go-sdk.md
      - Environment variables: reference/environment.md
      - Limits and defaults: reference/limits-and-defaults.md
      - Errors and machine output: reference/errors-and-output.md
      - Capability matrix: capabilities/README.md
      - JavaScript APIs: reference/javascript/index.md
      - npm compatibility: compatibility/README.md
  - Operate:
      - Security: security/README.md
      - Production: operations/production.md
      - Performance:
          - Overview: performance/README.md
          - Redis: performance/redis.md
  - Internals:
      - Architecture: architecture/README.md
      - Decision records: adr/index.md
      - JavaScript compatibility notes: architecture/javascript-runtime-compatibility.md
      - Runtime ownership: architecture/javascript-runtime-convergence.md
      - Decisions:
          - Rust core: adr/001-runtime-core-rust.md
          - QuickJS engine: adr/002-quickjs-ng-engine.md
          - Web API first: adr/003-web-api-first.md
          - Single executable: adr/004-build-once-ship-one-file.md
          - Deny by default: adr/005-deny-by-default.md
          - Process isolation: adr/006-process-isolation.md
          - Durable replay: adr/007-durable-replay.md
          - WIT capability ABI: adr/008-wit-capability-abi.md
          - No AOT requirement: adr/009-no-aot-on-v1-path.md
          - TypeScript frontend: adr/010-static-typescript-parallel.md
markdown_extensions:
  - tables
  - fenced_code
  - toc:
      permalink: true
