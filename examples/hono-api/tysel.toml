schema_version = 1

[app]
name = "hono-api"
entry = "src/index.ts"
profile = "service"

[server]
listen = "127.0.0.1:3000"

[limits]
memory_mb = 64
cpu_ms_per_turn = 50
request_timeout_ms = 30000

[tasks.verify]
description = "Check the application"
steps = [["check"]]

[tasks.release]
depends = ["verify"]
steps = [["build", "--release"]]
