schema_version = 1

[app]
name = "sqlite-worker"
entry = "src/index.ts"
profile = "service"

[server]
listen = "127.0.0.1:3000"

[durable]
store = "sqlite"
path = "./data/tysel.db"

[tasks.verify]
description = "Check the application"
steps = [["check"]]

[tasks.release]
depends = ["verify"]
steps = [["build", "--release"]]
