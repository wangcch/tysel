schema_version = 1

[app]
name = "durable-agent"
entry = "src/index.ts"
profile = "service"

[server]
listen = "127.0.0.1:3000"
http1 = true
http2 = false
websocket = false

[permissions]
secrets = ["OPENAI_API_KEY"]

[limits]
memory_mb = 64
cpu_ms_per_turn = 50
request_timeout_ms = 30000
max_in_flight = 256

[durable]
store = "sqlite"
path = "./data/tysel.db"

[observability]
logs = "json"

[tasks.verify]
description = "Check the application"
steps = [["check"]]

[tasks.release]
depends = ["verify"]
steps = [["build", "--release"]]
