schema_version = 1

[app]
name = "isolated-plugin"
entry = "src/index.ts"
profile = "isolated"

[server]
listen = "127.0.0.1:0"
http1 = true
http2 = false
websocket = false

[permissions]
fetch = ["api.example.com"]
fs_read = ["./data"]

[limits]
memory_mb = 32
cpu_ms_per_turn = 50
request_timeout_ms = 5000
max_in_flight = 32

[observability]
logs = "json"

[tasks.verify]
description = "Check the application"
steps = [["check"]]

[tasks.release]
depends = ["verify"]
steps = [["build", "--release"]]
