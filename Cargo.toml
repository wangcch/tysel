[workspace]
resolver = "3"
exclude = ["sdk/examples/rust-echo"]
members = [
    "crates/tysel-cli",
    "crates/tysel-build",
    "crates/tysel-package",
    "crates/tysel-manifest",
    "crates/tysel-runtime",
    "crates/tysel-engine",
    "crates/tysel-engine-qjs",
    "crates/tysel-engine-wasm",
    "crates/tysel-component-sdk",
    "crates/tysel-scheduler",
    "crates/tysel-task",
    "crates/tysel-task-rpc",
    "crates/tysel-durable",
    "crates/tysel-policy",
    "crates/tysel-capability",
    "crates/tysel-cap-http",
    "crates/tysel-cap-fs",
    "crates/tysel-cap-sqlite",
    "crates/tysel-cap-postgres",
    "crates/tysel-cap-llm",
    "crates/tysel-cap-mcp",
    "crates/tysel-isolate",
    "crates/tysel-ipc",
    "crates/tysel-observability",
    "crates/tysel-testkit",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95.0"
authors = ["Tysel Contributors"]
description = "A lightweight native runtime for TypeScript services and agents."

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process", "signal"] }
rquickjs = "0.12"
bytes = "1"
http = "1"
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio-native-tls = "0.3"
native-tls = "0.2"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
wasmtime = { version = "=32.0.1", default-features = false, features = ["component-model", "cranelift", "runtime", "std"] }
wasmtime-wasi = { version = "=32.0.1", default-features = false }
libc = "0.2"
oxc = { version = "0.146", features = ["semantic", "transformer", "codegen"] }
oxc_resolver = "11"

tysel-manifest = { path = "crates/tysel-manifest" }
tysel-engine = { path = "crates/tysel-engine" }
tysel-engine-wasm = { path = "crates/tysel-engine-wasm" }
tysel-component-sdk = { path = "crates/tysel-component-sdk" }
tysel-engine-qjs = { path = "crates/tysel-engine-qjs" }
tysel-package = { path = "crates/tysel-package" }
tysel-build = { path = "crates/tysel-build" }
tysel-ipc = { path = "crates/tysel-ipc" }
tysel-isolate = { path = "crates/tysel-isolate" }
tysel-capability = { path = "crates/tysel-capability" }
tysel-policy = { path = "crates/tysel-policy" }
tysel-cap-sqlite = { path = "crates/tysel-cap-sqlite" }
tysel-cap-fs = { path = "crates/tysel-cap-fs" }
tysel-cap-postgres = { path = "crates/tysel-cap-postgres" }
tysel-observability = { path = "crates/tysel-observability" }
tysel-task = { path = "crates/tysel-task" }
tysel-task-rpc = { path = "crates/tysel-task-rpc" }
tysel-cap-mcp = { path = "crates/tysel-cap-mcp" }
tysel-cap-llm = { path = "crates/tysel-cap-llm" }

[workspace.lints.rust]
unsafe_code = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
