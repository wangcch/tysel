name: website

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  pull_request:
    paths:
      - ".github/scripts/classify-ci-changes.sh"
      - ".github/scripts/deploy-website-oss.sh"
      - ".github/scripts/fetch-benchmark-evidence.sh"
      - ".github/scripts/test-classify-ci-changes.sh"
      - ".github/scripts/validate-benchmark-evidence.jq"
      - ".github/scripts/verify-current-main.sh"
      - ".github/workflows/ci.yml"
      - ".github/workflows/website.yml"
      - "brand/**"
      - "docs/**"
      - "crates/tysel-cli/src/**"
      - "crates/tysel-manifest/schema/**"
      - "packages/tysel-types/src/**"
      - "runtime-js/web-api/compatibility.json"
      - "website/**"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Reject a superseded main CI run
        if: github.event_name == 'workflow_run'
        run: >-
          bash .github/scripts/verify-current-main.sh
          "${{ github.event.workflow_run.head_sha }}"
      - name: Download CI change classification
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-change-classification
          path: target/ci-change-classification
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Select benchmark evidence provenance
        if: github.event_name == 'workflow_run'
        shell: bash
        env:
          CI_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          CI_SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          classification=target/ci-change-classification/classification.json
          jq -e --arg sourceCommit "$CI_SOURCE_COMMIT" '
            .schemaVersion == 1
            and (.sourceCommit == $sourceCommit)
            and (.mode == "docs-only" or .mode == "full")
            and (.docsOnly | type == "boolean")
            and (.full | type == "boolean")
            and (.benchmarkRequired | type == "boolean")
            and (.docsOnly != .full)
            and (.benchmarkRequired == .full)
            and ((.mode == "docs-only") == .docsOnly)
            and ((.mode == "full") == .full)
          ' "$classification" > /dev/null
          if [[ "$(jq -r '.benchmarkRequired' "$classification")" == true ]]; then
            echo "BENCHMARK_WORKFLOW_RUN_ID=$CI_WORKFLOW_RUN_ID" >> "$GITHUB_ENV"
            echo "BENCHMARK_SOURCE_COMMIT=$CI_SOURCE_COMMIT" >> "$GITHUB_ENV"
            echo "Benchmark evidence must match the triggering full CI run"
          else
            echo "Docs-only CI: reusing the latest fresh, verified main benchmark evidence"
          fi
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 11.5.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - name: Install website dependencies
        run: pnpm install --frozen-lockfile
        working-directory: website
      - name: Fetch latest Linux admission evidence
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash .github/scripts/fetch-benchmark-evidence.sh
      - name: Check documentation against public contracts
        run: pnpm check:docs-contracts
        working-directory: website
      - name: Check benchmark evidence loader
        run: pnpm test:benchmarks
        working-directory: website
      - name: Check localization contracts
        run: pnpm test:i18n && pnpm i18n:check
        working-directory: website
      - name: Build static website
        run: pnpm build
        working-directory: website
      - name: Verify localized HTML and section links
        run: python3 scripts/check-localized-html.py
        working-directory: website
      - name: Verify sitemap and multilingual SEO
        run: python3 scripts/check-seo.py
        working-directory: website
      - name: Verify generated documentation is committed
        run: |
          changes="$(git status --short --untracked-files=all -- website/content)"
          if [ -n "$changes" ]; then
            echo "Generated documentation is not synchronized:"
            echo "$changes"
            exit 1
          fi
      - name: Verify static export
        run: |
          test -s website/out/index.html
          test -s website/out/404.html
          test -s website/out/api/search
          jq -e '.type == "advanced"' website/out/api/search > /dev/null
          test -s website/out/benchmark-evidence/latest.json
          jq -e '.status == "published" or .status == "unpublished"' \
            website/out/benchmark-evidence/latest.json > /dev/null
          test -n "$(find website/out/_next/static -type f -print -quit)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: website-static-${{ github.sha }}
          path: website/out
          if-no-files-found: error
          retention-days: 7

  deploy:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: website-production
      url: https://tysel.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: website-static-${{ github.sha }}
          path: website/out
      - name: Install pinned ossutil
        env:
          OSSUTIL_SHA256: dcc512e4a893e16bbee63bc769339d8e56b21744fd83c8212a9d8baf28767343
          OSSUTIL_URL: https://gosspublic.alicdn.com/ossutil/1.7.19/ossutil-v1.7.19-linux-amd64.zip
        run: |
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/ossutil.zip" "$OSSUTIL_URL"
          echo "$OSSUTIL_SHA256  $RUNNER_TEMP/ossutil.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/ossutil.zip" -d "$RUNNER_TEMP/ossutil"
          echo "$RUNNER_TEMP/ossutil/ossutil-v1.7.19-linux-amd64" >> "$GITHUB_PATH"
      - name: Recheck main before publishing
        run: >-
          bash .github/scripts/verify-current-main.sh
          "${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}"
      - name: Deploy to Alibaba Cloud OSS Hong Kong
        env:
          ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          ALIYUN_OSS_BUCKET: ${{ vars.ALIYUN_OSS_BUCKET }}
        run: bash .github/scripts/deploy-website-oss.sh website/out
