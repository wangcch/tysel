name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  FUZZ_TARGET: x86_64-unknown-linux-gnu
  FUZZ_TOOLCHAIN: nightly-2026-08-15
  TYSEL_TOOLCHAIN_IMAGE: ghcr.io/wangcch/tysel-toolchain

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: . -> target
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify release tag targets current main
        if: startsWith(github.ref, 'refs/tags/v')
        run: bash .github/scripts/verify-current-main.sh "$GITHUB_SHA"
      - uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f # v2
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2,cargo-fuzz@0.13.2
      - name: Run source and dependency policy gates
        run: |
          cargo fmt --all -- --check
          bash -n install.sh .github/scripts/*.sh
          version="$(bash .github/scripts/check-version-sync.sh)"
          bash .github/scripts/test-release-channel.sh
          bash .github/scripts/test-published-trust.sh
          bash .github/scripts/test-types-package.sh
          channel="$(bash .github/scripts/release-channel.sh "$version")"
          cargo run --locked -p tysel-build --bin tysel-supply-chain -- \
            --check --release-channel "$channel"
          cargo audit --deny warnings
          cargo deny check
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ env.FUZZ_TOOLCHAIN }}
          targets: ${{ env.FUZZ_TARGET }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        env:
          CARGO_BUILD_TARGET: ${{ env.FUZZ_TARGET }}
          RUSTUP_TOOLCHAIN: ${{ env.FUZZ_TOOLCHAIN }}
        with:
          workspaces: fuzz -> target
      - name: Run bounded release fuzz suite
        env:
          CARGO_BUILD_TARGET: ${{ env.FUZZ_TARGET }}
          RUSTUP_TOOLCHAIN: ${{ env.FUZZ_TOOLCHAIN }}
        run: |
          cargo metadata --locked \
            --manifest-path fuzz/Cargo.toml --format-version 1 --no-deps > /dev/null
          for target in tap_decode manifest_parse isolate_ipc task_rpc release_metadata; do
            cargo fuzz run --target "$FUZZ_TARGET" "$target" -- \
              -runs=10000 -timeout=10 -rss_limit_mb=4096
          done
      - name: Record source security policy evidence
        shell: bash
        run: |
          mkdir -p target/release-policy
          jq -n \
            --arg sourceCommit "$GITHUB_SHA" \
            --arg cargoLockSha256 "$(sha256sum Cargo.lock | awk '{print $1}')" \
            --arg fuzzToolchain "$FUZZ_TOOLCHAIN" \
            '{evidenceVersion: 1, scope: "source", sourceCommit: $sourceCommit,
              cargoLockSha256: $cargoLockSha256,
              dependencyGates: {cargoAudit: "0.22.2", cargoDeny: "0.20.2"},
              fuzz: {cargoFuzz: "0.13.2", toolchain: $fuzzToolchain, runsPerTarget: 10000,
                targets: ["tap_decode", "manifest_parse", "isolate_ipc", "task_rpc", "release_metadata"]}}' \
            > target/release-policy/security-policy-evidence.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-policy
          path: target/release-policy/security-policy-evidence.json
          if-no-files-found: error

  package-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pack and test external npm consumers
        run: bash .github/scripts/test-types-package.sh
      - name: Create immutable npm artifacts
        run: |
          mkdir -p target/npm-packages
          pnpm --dir packages/tysel-types pack --pack-destination "$PWD/target/npm-packages"
          pnpm --dir packages/tysel-test pack --pack-destination "$PWD/target/npm-packages"
          pnpm --dir packages/tysel pack --pack-destination "$PWD/target/npm-packages"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-packages
          path: target/npm-packages/*.tgz
          if-no-files-found: error

  package-rust-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
      - name: Package and verify the public Rust SDK
        run: cargo package --locked --package tysel-component-sdk
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-sdk-package
          path: target/package/tysel-component-sdk-*.crate
          if-no-files-found: error

  package-component-starters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
      - uses: bytecodealliance/actions/wasm-tools/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1
        with:
          version: "1.247.0"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.25.5
          cache-dependency-path: sdk/examples/go-echo/go.sum
      - name: Package standalone Component starters
        shell: bash
        run: |
          version="$(bash .github/scripts/check-version-sync.sh)"
          source_date_epoch="$(git log -1 --pretty=%ct)"
          bash .github/scripts/package-component-starters.sh \
            target/component-starters-output "$version" "$source_date_epoch"
          mkdir -p target/component-starters-check
          tar -xzf target/component-starters-output/tysel-component-starters.tar.gz \
            -C target/component-starters-check
          rust_starter="target/component-starters-check/tysel-component-starters/rust-echo"
          cargo build --locked --manifest-path "$rust_starter/Cargo.toml" \
            --target wasm32-unknown-unknown --release
          wasm-tools component new \
            "$rust_starter/target/wasm32-unknown-unknown/release/tysel_rust_echo_component.wasm" \
            -o "$rust_starter/target/echo.component.wasm"
          go install github.com/bytecodealliance/componentize-go@v0.4.1
          go_starter="target/component-starters-check/tysel-component-starters/go-echo"
          (
            cd "$go_starter"
            componentize-go -d wit/component -w task build -o echo.component.wasm
          )
          (
            cd "$go_starter/sdk/component-go"
            go test ./...
          )
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: component-starters
          path: target/component-starters-output/*
          if-no-files-found: error

  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.runner }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tysel
          POSTGRES_PASSWORD: tysel
          POSTGRES_DB: tysel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tysel -d tysel"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TYSEL_POSTGRES_TEST_URL: postgres://tysel:tysel@127.0.0.1:5432/tysel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build TypeScript SDK for application fixtures
        run: |
          pnpm --filter @tysel/types build
          pnpm --filter @tysel/sdk build
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Record deterministic build epoch
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
      - name: Run target production acceptance suite
        run: |
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace --all-targets
      - name: Build and package two independent release trees
        shell: bash
        run: >-
          bash .github/scripts/package-release-target.sh
          "${{ matrix.target }}" "$SOURCE_DATE_EPOCH"
      - name: Run local installer fixture
        shell: bash
        run: |
          version="$(bash .github/scripts/check-version-sync.sh)"
          bash .github/scripts/test-installer.sh \
            "$version" "${{ matrix.target }}" target/release-output
      - name: Record target benchmark evidence
        env:
          TYSEL_STUB: target/repro-1/release/tysel-service
        run: >-
          cargo run --locked -p tysel-testkit --bin tysel-bench --release --
          --evidence target/release-output/benchmark-evidence-${{ matrix.target }}.json
          --source-commit ${{ github.sha }}
          --command "cargo run --locked -p tysel-testkit --bin tysel-bench --release"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-release-${{ matrix.target }}
          path: target/release-output/*
          if-no-files-found: error

  build-darwin:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: darwin-x64
          - runner: macos-15
            target: darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build TypeScript SDK for application fixtures
        run: |
          pnpm --filter @tysel/types build
          pnpm --filter @tysel/sdk build
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Record deterministic build epoch
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
      - name: Run Darwin production acceptance suite
        run: |
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace --all-targets
      - name: Build and package two independent Darwin release trees
        shell: bash
        run: >-
          bash .github/scripts/package-release-target.sh
          "${{ matrix.target }}" "$SOURCE_DATE_EPOCH"
      - name: Run local installer fixture
        shell: bash
        run: |
          version="$(bash .github/scripts/check-version-sync.sh)"
          bash .github/scripts/test-installer.sh \
            "$version" "${{ matrix.target }}" target/release-output
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-release-${{ matrix.target }}
          path: target/release-output/*
          if-no-files-found: error

  sign:
    needs: [policy, build-linux, build-darwin, package-component-starters]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: unsigned-release-*
          path: target/release-output
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-policy
          path: target/release-policy
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: component-starters
          path: target/release-output
      - name: Assemble target security evidence
        shell: bash
        run: |
          set -euo pipefail
          version="$(bash .github/scripts/check-version-sync.sh)"
          bash .github/scripts/assemble-security-evidence.sh \
            target/release-policy/security-policy-evidence.json \
            target/release-output "$version" "$GITHUB_SHA" Cargo.lock "$FUZZ_TOOLCHAIN"
      - name: Build isolated release metadata tools
        run: >-
          cargo build --locked --release
          -p tysel-release-signing --bin tysel-release-signer
          -p tysel-build --bin tysel-trust-policy
          -p tysel-distribution --bin tysel-release-metadata
      - name: Sign deterministic release evidence
        shell: bash
        env:
          TYSEL_RELEASE_KEY_HEX: ${{ secrets.TYSEL_RELEASE_KEY_HEX }}
          TYSEL_RELEASE_PREVIOUS_KEY_HEX: ${{ secrets.TYSEL_RELEASE_PREVIOUS_KEY_HEX }}
          TYSEL_RELEASE_KEY_VALID_FROM_UNIX: ${{ vars.TYSEL_RELEASE_KEY_VALID_FROM_UNIX }}
          TYSEL_RELEASE_PREVIOUS_KEY_VALID_FROM_UNIX: ${{ vars.TYSEL_RELEASE_PREVIOUS_KEY_VALID_FROM_UNIX }}
          TYSEL_RELEASE_PREVIOUS_KEY_VALID_UNTIL_UNIX: ${{ vars.TYSEL_RELEASE_PREVIOUS_KEY_VALID_UNTIL_UNIX }}
        run: |
          set -euo pipefail
          if [[ ! "$TYSEL_RELEASE_KEY_HEX" =~ ^[0-9a-f]{64}$ ]]; then
            echo "TYSEL_RELEASE_KEY_HEX must contain one canonical 32-byte Ed25519 seed" >&2
            exit 1
          fi
          if [[ ! "$TYSEL_RELEASE_KEY_VALID_FROM_UNIX" =~ ^(0|[1-9][0-9]*)$ ]]; then
            echo "TYSEL_RELEASE_KEY_VALID_FROM_UNIX must be the key's persistent inception time" >&2
            exit 1
          fi
          key_path="${RUNNER_TEMP}/tysel-release.key"
          previous_key_path="${RUNNER_TEMP}/tysel-release-previous.key"
          trap 'rm -f "$key_path" "$previous_key_path"' EXIT
          install -m 600 /dev/null "$key_path"
          printf '%s\n' "$TYSEL_RELEASE_KEY_HEX" > "$key_path"
          if [[ -n "$TYSEL_RELEASE_PREVIOUS_KEY_HEX" ]]; then
            if [[ ! "$TYSEL_RELEASE_PREVIOUS_KEY_HEX" =~ ^[0-9a-f]{64}$ ]]; then
              echo "TYSEL_RELEASE_PREVIOUS_KEY_HEX must contain one canonical Ed25519 seed" >&2
              exit 1
            fi
            [[ "$TYSEL_RELEASE_PREVIOUS_KEY_HEX" != "$TYSEL_RELEASE_KEY_HEX" ]] || {
              echo "current and previous release keys must be different" >&2
              exit 1
            }
            if [[ ! "$TYSEL_RELEASE_PREVIOUS_KEY_VALID_FROM_UNIX" =~ ^(0|[1-9][0-9]*)$ ]]; then
              echo "TYSEL_RELEASE_PREVIOUS_KEY_VALID_FROM_UNIX must preserve the old key inception" >&2
              exit 1
            fi
            if [[ ! "$TYSEL_RELEASE_PREVIOUS_KEY_VALID_UNTIL_UNIX" =~ ^(0|[1-9][0-9]*)$ ]]; then
              echo "TYSEL_RELEASE_PREVIOUS_KEY_VALID_UNTIL_UNIX must be a fixed retirement deadline" >&2
              exit 1
            fi
            install -m 600 /dev/null "$previous_key_path"
            printf '%s\n' "$TYSEL_RELEASE_PREVIOUS_KEY_HEX" > "$previous_key_path"
          fi
          version="$(bash .github/scripts/check-version-sync.sh)"
          channel="$(bash .github/scripts/release-channel.sh "$version")"
          target/release/tysel-release-signer \
            target/release-output/tysel-component-starters.tar.gz \
            --metadata --key "$key_path"
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            archive="target/release-output/tysel-${version}-${target}.tar.gz"
            target/release/tysel-release-signer "$archive" \
              --target "$target" --key "$key_path"
            target/release/tysel-release-signer "${archive}.repro.json" \
              --target "$target" --key "$key_path"
          done
          for target in linux-x64 linux-arm64; do
            target/release/tysel-release-signer \
              "target/release-output/benchmark-evidence-${target}.json" \
              --target "$target" --key "$key_path"
            target/release/tysel-release-signer \
              "target/release-output/security-evidence-${target}.json" \
              --target "$target" --key "$key_path"
          done
          published_unix="$(date -u +%s)"
          (( TYSEL_RELEASE_KEY_VALID_FROM_UNIX <= published_unix )) || {
            echo "current release key inception is in the future" >&2
            exit 1
          }
          if [[ -f "$previous_key_path" ]]; then
            (( TYSEL_RELEASE_PREVIOUS_KEY_VALID_FROM_UNIX <= published_unix )) || {
              echo "previous release key inception is in the future" >&2
              exit 1
            }
            (( published_unix < TYSEL_RELEASE_PREVIOUS_KEY_VALID_UNTIL_UNIX )) || {
              echo "previous release key has reached its fixed retirement deadline" >&2
              exit 1
            }
          fi
          published_at="$(date -u -d "@${published_unix}" +%Y-%m-%dT%H:%M:%SZ)"
          base_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${version}"
          bash .github/scripts/assemble-release-manifest.sh \
            target/release-output "$version" "$GITHUB_SHA" "$published_at" \
            "$base_url" target/release-output/release-manifest.json
          target/release/tysel-release-metadata release \
            target/release-output/release-manifest.json
          target/release/tysel-release-signer \
            target/release-output/release-manifest.json --metadata --key "$key_path"
          key_info="$(target/release/tysel-release-signer --key-info --key "$key_path")"
          expires_at_unix="$((published_unix + 7776000))"
          if [[ -f "$previous_key_path" ]]; then
            previous_key_info="$(target/release/tysel-release-signer --key-info --key "$previous_key_path")"
            jq -n \
              --argjson key "$key_info" \
              --argjson previous "$previous_key_info" \
              --argjson issuedAtUnix "$published_unix" \
              --argjson expiresAtUnix "$expires_at_unix" \
              --argjson keyValidFrom "$TYSEL_RELEASE_KEY_VALID_FROM_UNIX" \
              --argjson previousValidFrom "$TYSEL_RELEASE_PREVIOUS_KEY_VALID_FROM_UNIX" \
              --argjson previousValidUntil "$TYSEL_RELEASE_PREVIOUS_KEY_VALID_UNTIL_UNIX" \
              '{policy_version: 1, issued_at_unix: $issuedAtUnix,
                expires_at_unix: $expiresAtUnix,
                keys: [
                  {key_id: $key.key_id, algorithm: $key.algorithm,
                    public_key: $key.public_key, status: "active",
                    valid_from_unix: $keyValidFrom},
                  {key_id: $previous.key_id, algorithm: $previous.algorithm,
                    public_key: $previous.public_key, status: "retired",
                    valid_from_unix: $previousValidFrom,
                    valid_until_unix: $previousValidUntil}
                ] | sort_by(.key_id)}' \
              > target/release-output/trust.json
            trust_signing_key="$previous_key_path"
          else
            jq -n \
              --argjson key "$key_info" \
              --argjson issuedAtUnix "$published_unix" \
              --argjson expiresAtUnix "$expires_at_unix" \
              --argjson keyValidFrom "$TYSEL_RELEASE_KEY_VALID_FROM_UNIX" \
              '{policy_version: 1, issued_at_unix: $issuedAtUnix,
                expires_at_unix: $expiresAtUnix,
                keys: [{key_id: $key.key_id, algorithm: $key.algorithm,
                  public_key: $key.public_key, status: "active",
                  valid_from_unix: $keyValidFrom}]}' \
              > target/release-output/trust.json
            trust_signing_key="$key_path"
          fi
          target/release/tysel-release-signer \
            target/release-output/trust.json --metadata --key "$trust_signing_key"
          prior_trust="${RUNNER_TEMP}/published-trust.json"
          trust_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/trust/trust.json"
          trust_status="$(curl -sS -L -o "$prior_trust" -w '%{http_code}' "$trust_url")"
          if [[ "$trust_status" == 200 ]]; then
            target/release/tysel-trust-policy verify-transition \
              "$prior_trust" target/release-output/trust.json \
              target/release-output/trust.json.sig.json "$published_unix"
          elif [[ "$trust_status" == 404 ]]; then
            [[ ! -f "$previous_key_path" ]] || {
              echo "a previous key cannot be configured for the first published trust policy" >&2
              exit 1
            }
            target/release/tysel-trust-policy validate target/release-output/trust.json
          else
            echo "cannot read current published trust policy: HTTP $trust_status" >&2
            exit 1
          fi
          manifest_sha256="$(sha256sum target/release-output/release-manifest.json | awk '{print $1}')"
          manifest_size="$(wc -c < target/release-output/release-manifest.json | tr -d '[:space:]')"
          jq -n \
            --arg channel "$channel" \
            --arg version "$version" \
            --arg publishedAt "$published_at" \
            --arg manifestUrl "${base_url}/release-manifest.json" \
            --argjson manifestByteSize "$manifest_size" \
            --arg manifestSha256 "$manifest_sha256" \
            --arg signatureUrl "${base_url}/release-manifest.json.sig.json" \
            --arg keyId "$(jq -er '.key_id' target/release-output/release-manifest.json.sig.json)" \
            '{schemaVersion: 1, channel: $channel, version: $version,
              publishedAt: $publishedAt, manifestUrl: $manifestUrl,
              manifestByteSize: $manifestByteSize, manifestSha256: $manifestSha256,
              manifestSignature: {algorithm: "ed25519", url: $signatureUrl, keyId: $keyId},
              requiredFeatures: ["atomic-bin-link", "build-info-v1", "ed25519-manifest"]}' \
            > target/release-output/channel-pointer.json
          target/release/tysel-release-metadata channel \
            target/release-output/channel-pointer.json
          target/release/tysel-release-signer \
            target/release-output/channel-pointer.json --metadata --key "$key_path"
          printf '%s\n' "$version" > "target/release-output/${channel}-version"
          install -m 644 install.sh target/release-output/install.sh
          sha256sum target/release-output/install.sh \
            | awk '{print $1}' > target/release-output/install.sh.sha256
          bash .github/scripts/verify-release-assets.sh target/release-output "$version"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-release
          path: target/release-output/*
          if-no-files-found: error

  stage-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [sign, package-npm, package-rust-sdk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-release
          path: target/publish
      - name: Stage and verify immutable assets in a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(bash .github/scripts/check-version-sync.sh)"
          channel="$(bash .github/scripts/release-channel.sh "$version")"
          bash .github/scripts/verify-release-assets.sh target/publish "$version"
          if gh release view "$GITHUB_REF_NAME" --json isDraft > target/release-state.json 2>/dev/null; then
            jq -e '.isDraft == true' target/release-state.json > /dev/null || {
              echo "release is already public and immutable" >&2
              exit 1
            }
          else
            release_flags=(--draft --verify-tag --generate-notes)
            [[ "$channel" == stable ]] || release_flags+=(--prerelease)
            gh release create "$GITHUB_REF_NAME" "${release_flags[@]}"
          fi
          gh release upload "$GITHUB_REF_NAME" target/publish/* --clobber
          find target/publish -maxdepth 1 -type f -exec basename {} \; | sort > target/local-assets
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | sort \
            > target/remote-assets
          diff -u target/local-assets target/remote-assets

  publication-preflight:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: stage-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Reject a release-channel regression before registry publication
        run: |
          set -euo pipefail
          version="$(bash .github/scripts/check-version-sync.sh)"
          bash .github/scripts/check-published-channel.sh \
            "$version" "https://github.com/${GITHUB_REPOSITORY}/releases"

  publish-toolchain-platform:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publication-preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
            platform: linux/amd64
            suffix: amd64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
            platform: linux/arm64
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-release
          path: target/publish
      - name: Verify the signed archive and prepare the image context
        shell: bash
        run: |
          set -euo pipefail
          version="$(bash .github/scripts/check-version-sync.sh)"
          archive="target/publish/tysel-${version}-${{ matrix.target }}.tar.gz"
          expected_sha256="$(tr -d '[:space:]' < "${archive}.sha256")"
          actual_sha256="$(sha256sum "$archive" | awk '{print $1}')"
          [[ "$actual_sha256" == "$expected_sha256" ]]
          mkdir -p target/toolchain-archive
          tar -xzf "$archive" -C target/toolchain-archive
          bash .github/scripts/prepare-toolchain-image.sh \
            "target/toolchain-archive/tysel-${version}-${{ matrix.target }}/bin" \
            target/toolchain-image "$version" "${{ matrix.target }}" "$GITHUB_SHA"
      - name: Build, test, and publish the platform image
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(bash .github/scripts/check-version-sync.sh)"
          source_date_epoch="$(git log -1 --pretty=%ct)"
          image="${TYSEL_TOOLCHAIN_IMAGE}:${version}-${{ matrix.suffix }}"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build \
            --file .github/docker/toolchain.Dockerfile \
            --platform "${{ matrix.platform }}" \
            --build-arg "TYSEL_VERSION=${version}" \
            --build-arg "TYSEL_SOURCE_COMMIT=${GITHUB_SHA}" \
            --build-arg "TYSEL_SOURCE_URL=https://github.com/${GITHUB_REPOSITORY}" \
            --build-arg "SOURCE_DATE_EPOCH=${source_date_epoch}" \
            --tag "$image" \
            target/toolchain-image
          for binary in tysel tysel-service tysel-worker; do
            docker run --rm --entrypoint "$binary" "$image" --build-info-json \
              | jq -e --arg binary "$binary" --arg version "$version" \
                '.schemaVersion == 1 and .binary == $binary and .version == $version' \
                > /dev/null
          done
          docker push "$image"

  publish-toolchain-image:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish-toolchain-platform
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Publish and verify the multi-platform image
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(bash .github/scripts/check-version-sync.sh)"
          image="$TYSEL_TOOLCHAIN_IMAGE"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create \
            --tag "${image}:${version}" \
            "${image}:${version}-amd64" \
            "${image}:${version}-arm64"
          docker buildx imagetools inspect --raw "${image}:${version}" \
            > target/toolchain-image-index.json
          jq -e \
            '[.manifests[].platform | {os, architecture}] | sort_by(.architecture)
              == [{os: "linux", architecture: "amd64"},
                  {os: "linux", architecture: "arm64"}]' \
            target/toolchain-image-index.json > /dev/null
          inspection="$(docker buildx imagetools inspect "${image}:${version}")"
          digest="$(awk '$1 == "Digest:" {print $2; exit}' <<< "$inspection")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'Published `%s@%s` for linux/amd64 and linux/arm64.\n' \
            "$image" "$digest" >> "$GITHUB_STEP_SUMMARY"
          docker logout ghcr.io
          if ! docker buildx imagetools inspect "${image}:${version}" > /dev/null; then
            echo "${image} is not anonymously readable" >&2
            echo "Confirm that the package is linked to this public repository and is Public" >&2
            exit 1
          fi

  publish-npm:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish-toolchain-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-packages
          path: target/npm-packages
      - name: Publish or verify matching npm packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          npm_user="$(npm whoami)"
          [[ -n "$npm_user" ]]
          echo "Authenticated to npm as ${npm_user}"
          version="$(bash .github/scripts/check-version-sync.sh)"
          bash .github/scripts/publish-npm-packages.sh target/npm-packages "$version"

  publish-rust-sdk:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish-npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rust-sdk-package
          path: target/rust-sdk-package
      - name: Publish or verify the matching Rust SDK crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          version="$(bash .github/scripts/check-version-sync.sh)"
          bash .github/scripts/publish-rust-sdk.sh target/rust-sdk-package "$version"

  promote-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [stage-release, publish-npm, publish-rust-sdk, publish-toolchain-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-release
          path: target/publish
      - name: Publish the verified draft and advance its release channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(bash .github/scripts/check-version-sync.sh)"
          bash .github/scripts/promote-release.sh \
            "$version" "$GITHUB_REF_NAME" "$GITHUB_SHA" target/publish
