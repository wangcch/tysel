name: benchmark-comparison

on:
  workflow_dispatch:
    inputs:
      record:
        description: Run publication-grade jobs on fixed self-hosted hardware
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  contract:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Provision locked peer runtimes
        shell: bash
        run: |
          tool_bin="$(benchmarks/comparison/provision-linux.sh)"
          echo "${tool_bin}" >> "${GITHUB_PATH}"
      - name: Install locked TypeScript 7 toolchain
        run: npm exec --yes --package=pnpm@11.5.0 -- pnpm install --frozen-lockfile
      - name: Capture runner contract
        run: >-
          benchmarks/comparison/runner-doctor-linux.sh
          --output target/benchmark-comparison/runner-doctor-${{ matrix.arch }}.json
      - run: cargo test --locked -p tysel-bench-compare
      - run: >-
          cargo run --locked -p tysel-bench-compare --bin tysel-bench-compare --
          --quick
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: comparison-smoke-${{ matrix.arch }}
          path: |
            target/benchmark-comparison/comparison-v1.json
            target/benchmark-comparison/comparison-v1.md
            target/benchmark-comparison/runner-doctor-${{ matrix.arch }}.json
          if-no-files-found: error

  # Publication-grade jobs require fixed, pre-provisioned runners carrying the
  # `tysel-benchmark` label and the exact runtimes from runtimes.lock.json.
  record:
    if: ${{ inputs.record }}
    strategy:
      matrix:
        include:
          - labels: '["self-hosted","linux","x64","tysel-benchmark"]'
            arch: x86_64
          - labels: '["self-hosted","linux","arm64","tysel-benchmark"]'
            arch: arm64
    runs-on: ${{ fromJSON(matrix.labels) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Provision locked peer runtimes
        shell: bash
        run: |
          tool_bin="$(benchmarks/comparison/provision-linux.sh)"
          echo "${tool_bin}" >> "${GITHUB_PATH}"
      - name: Install locked TypeScript 7 toolchain
        run: npm exec --yes --package=pnpm@11.5.0 -- pnpm install --frozen-lockfile
      - name: Enforce fixed-runner contract
        run: >-
          benchmarks/comparison/runner-doctor-linux.sh --strict
          --output target/benchmark-comparison/runner-doctor-${{ matrix.arch }}.json
      - name: Record four rotated runtime orders
        shell: bash
        run: |
          set -euo pipefail
          for seed in 1 2 3 4; do
            cargo run --locked --release -p tysel-bench-compare --bin tysel-bench-compare -- \
              --order-seed "${seed}" \
              --output "target/benchmark-comparison/comparison-v1-${{ matrix.arch }}-seed${seed}.json"
          done
      - name: Aggregate architecture report
        shell: bash
        run: |
          cargo run --locked --release -p tysel-bench-compare --bin tysel-bench-report -- \
            --input target/benchmark-comparison/comparison-v1-${{ matrix.arch }}-seed*.json \
            --output target/benchmark-comparison/summary-v1-${{ matrix.arch }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: comparison-record-${{ matrix.arch }}
          path: |
            target/benchmark-comparison/comparison-v1-${{ matrix.arch }}-seed*.*
            target/benchmark-comparison/summary-v1-${{ matrix.arch }}.*
            target/benchmark-comparison/runner-doctor-${{ matrix.arch }}.json
          if-no-files-found: error
