name: benchmark-comparison

on:
  workflow_dispatch:
    inputs:
      record:
        description: Run publication-grade jobs on fixed self-hosted hardware
        required: false
        type: boolean
        default: false
      diagnose:
        description: Profile sustained 64 KiB loads on fixed self-hosted hardware
        required: false
        type: boolean
        default: false
      qjs_boundary:
        description: Run three non-publication QuickJS boundary diagnostics
        required: false
        type: boolean
        default: false
      record_arch:
        description: Architecture for selected self-hosted jobs
        required: false
        type: choice
        options:
          - all
          - x86_64
          - arm64
        default: all
      record_cycles:
        description: Space-separated record cycles to run (1 2 3)
        required: false
        type: string
        default: "1 2 3"
      record_seeds:
        description: Space-separated order seeds to run (1 2 3 4)
        required: false
        type: string
        default: "1 2 3 4"
      record_finalize:
        description: Aggregate all available cycles and enforce stability
        required: false
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  contract:
    if: ${{ !inputs.qjs_boundary || inputs.record || inputs.diagnose }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Provision locked peer runtimes
        shell: bash
        run: |
          tool_bin="$(benchmarks/comparison/provision-linux.sh)"
          echo "${tool_bin}" >> "${GITHUB_PATH}"
      - name: Install locked TypeScript 7 toolchain
        run: npm exec --yes --package=pnpm@11.5.0 -- pnpm install --frozen-lockfile
      - name: Capture runner contract
        run: >-
          benchmarks/comparison/runner-doctor-linux.sh
          --output target/benchmark-comparison/runner-doctor-${{ matrix.arch }}.json
      - run: cargo test --locked -p tysel-bench-compare
      - run: >-
          cargo run --locked -p tysel-bench-compare --bin tysel-bench-compare --
          --quick
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: comparison-smoke-${{ matrix.arch }}
          path: |
            target/benchmark-comparison/comparison-v1.json
            target/benchmark-comparison/comparison-v1.md
            target/benchmark-comparison/runner-doctor-${{ matrix.arch }}.json
          if-no-files-found: error

  diagnose:
    if: ${{ inputs.diagnose }}
    strategy:
      matrix:
        include:
          - labels: '["self-hosted","linux","x64","tysel-benchmark"]'
            arch: x86_64
          - labels: '["self-hosted","linux","arm64","tysel-benchmark"]'
            arch: arm64
    runs-on: ${{ fromJSON(matrix.labels) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Provision locked peer runtimes
        shell: bash
        run: |
          tool_bin="$(benchmarks/comparison/provision-linux.sh)"
          echo "${tool_bin}" >> "${GITHUB_PATH}"
      - name: Install locked TypeScript 7 toolchain
        run: npm exec --yes --package=pnpm@11.5.0 -- pnpm install --frozen-lockfile
      - name: Enforce fixed-runner contract
        run: >-
          benchmarks/comparison/runner-doctor-linux.sh --strict
          --output target/benchmark-comparison/diagnose-runner-${{ matrix.arch }}.json
      - name: Profile sustained 64 KiB workloads
        shell: bash
        run: |
          set -euo pipefail
          benchmarks/comparison/profile-sustained-linux.sh \
            --response bytes-64k --path /bytes/64k \
            --concurrency 100 --duration-seconds 120 \
            --output "target/benchmark-comparison/diagnose-${{ matrix.arch }}-bytes64k"
          benchmarks/comparison/profile-sustained-linux.sh \
            --response json-64k --path /json/64k \
            --concurrency 100 --duration-seconds 120 \
            --output "target/benchmark-comparison/diagnose-${{ matrix.arch }}-json64k"
      - name: Enforce sustained-load diagnosis contract
        shell: bash
        run: |
          set -euo pipefail
          for workload in bytes64k json64k; do
            directory="target/benchmark-comparison/diagnose-${{ matrix.arch }}-${workload}"
            jq -e '.perfStatus == "recorded" and .frequencySamples > 0 and .threadSamples > 0' \
              "${directory}/metadata.json" >/dev/null
            jq -e '.changePct != null and .changePct >= -5 and .clientCapacityPct != null and .clientCapacityPct < 75' \
              "${directory}/window-analysis.json" >/dev/null
            jq -e '.totalErrors == 0' "${directory}/load.json" >/dev/null
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: sustained-diagnosis-${{ matrix.arch }}
          path: |
            target/benchmark-comparison/diagnose-${{ matrix.arch }}-*/**
            target/benchmark-comparison/diagnose-runner-${{ matrix.arch }}.json
          if-no-files-found: error

  qjs-boundary:
    if: ${{ inputs.qjs_boundary }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ inputs.record_arch == 'all' && fromJSON('["x86_64","arm64"]') || fromJSON(format('["{0}"]', inputs.record_arch)) }}
    runs-on: ${{ fromJSON(matrix.arch == 'x86_64' && '["self-hosted","linux","x64","tysel-benchmark"]' || '["self-hosted","linux","arm64","tysel-benchmark"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Capture fixed-runner contract
        run: >-
          benchmarks/comparison/runner-doctor-linux.sh --strict --host-only
          --output target/benchmark-comparison/qjs-boundary-runner-${{ matrix.arch }}.json
      - name: Run three QuickJS boundary diagnostics
        run: >-
          benchmarks/comparison/run-qjs-boundary-linux.sh
          --arch "${{ matrix.arch }}"
          --output-dir "target/benchmark-comparison/qjs-boundary-${{ matrix.arch }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: qjs-boundary-${{ matrix.arch }}-attempt${{ github.run_attempt }}
          path: |
            target/benchmark-comparison/qjs-boundary-${{ matrix.arch }}/*.json
            target/benchmark-comparison/qjs-boundary-runner-${{ matrix.arch }}.json
          if-no-files-found: error

  # Publication-grade jobs require fixed, pre-provisioned runners carrying the
  # `tysel-benchmark` label and the exact runtimes from runtimes.lock.json.
  record:
    if: ${{ inputs.record }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - labels: '["self-hosted","linux","x64","tysel-benchmark"]'
            arch: x86_64
          - labels: '["self-hosted","linux","arm64","tysel-benchmark"]'
            arch: arm64
    runs-on: ${{ fromJSON(matrix.labels) }}
    env:
      RECORD_ROOT: /home/actions/tysel-benchmark-records/${{ github.sha }}/${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: ${{ inputs.record_arch == 'all' || inputs.record_arch == matrix.arch }}
      - name: Provision locked peer runtimes
        if: ${{ inputs.record_arch == 'all' || inputs.record_arch == matrix.arch }}
        shell: bash
        run: |
          tool_bin="$(benchmarks/comparison/provision-linux.sh)"
          echo "${tool_bin}" >> "${GITHUB_PATH}"
      - name: Install locked TypeScript 7 toolchain
        if: ${{ inputs.record_arch == 'all' || inputs.record_arch == matrix.arch }}
        run: npm exec --yes --package=pnpm@11.5.0 -- pnpm install --frozen-lockfile
      - name: Enforce fixed-runner contract
        if: ${{ inputs.record_arch == 'all' || inputs.record_arch == matrix.arch }}
        run: >-
          benchmarks/comparison/runner-doctor-linux.sh --strict
          --output target/benchmark-comparison/runner-doctor-${{ matrix.arch }}.json
      - name: Prepare record checkpoint
        id: prepare_record
        if: ${{ inputs.record_arch == 'all' || inputs.record_arch == matrix.arch }}
        shell: bash
        env:
          RECORD_CYCLES: ${{ inputs.record_cycles }}
          RECORD_SEEDS: ${{ inputs.record_seeds }}
        run: |
          set -euo pipefail

          validate_selection() {
            local label="$1"
            local selection="$2"
            local maximum="$3"
            local value
            [[ -n "${selection}" ]] || { echo "${label} selection is empty" >&2; return 1; }
            for value in ${selection}; do
              [[ "${value}" =~ ^[0-9]+$ ]] && (( value >= 1 && value <= maximum )) || {
                echo "invalid ${label}: ${value}" >&2
                return 1
              }
            done
          }

          validate_selection cycle "${RECORD_CYCLES}" 3
          validate_selection seed "${RECORD_SEEDS}" 4
          mkdir -p "${RECORD_ROOT}"
          cp "target/benchmark-comparison/runner-doctor-${{ matrix.arch }}.json" "${RECORD_ROOT}/"
          for cycle in ${RECORD_CYCLES}; do
            echo "cycle_${cycle}=true" >> "${GITHUB_OUTPUT}"
            rm -f "${RECORD_ROOT}/summary-v1-${{ matrix.arch }}-cycle${cycle}.json"
          done
          rm -f "${RECORD_ROOT}/stability-v1-${{ matrix.arch }}.json"
      - name: Record or resume cycle 1
        id: record_cycle_1
        if: >-
          ${{ (inputs.record_arch == 'all' || inputs.record_arch == matrix.arch) &&
              steps.prepare_record.outputs.cycle_1 == 'true' }}
        run: >-
          bash benchmarks/comparison/record-cycle-linux.sh
          --arch "${{ matrix.arch }}" --cycle 1
          --seeds "${{ inputs.record_seeds }}" --record-root "${RECORD_ROOT}"
      - name: Upload cycle 1 checkpoint
        if: >-
          ${{ always() && (inputs.record_arch == 'all' || inputs.record_arch == matrix.arch) &&
              steps.prepare_record.outcome == 'success' && steps.record_cycle_1.outcome != 'skipped' &&
              steps.prepare_record.outputs.cycle_1 == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: comparison-record-${{ matrix.arch }}-cycle1-attempt${{ github.run_attempt }}
          path: |
            ${{ env.RECORD_ROOT }}/comparison-v1-${{ matrix.arch }}-cycle1-seed*.json
            ${{ env.RECORD_ROOT }}/summary-v1-${{ matrix.arch }}-cycle1.json
            ${{ env.RECORD_ROOT }}/runner-doctor-${{ matrix.arch }}.json
          if-no-files-found: error
      - name: Record or resume cycle 2
        id: record_cycle_2
        if: >-
          ${{ success() && (inputs.record_arch == 'all' || inputs.record_arch == matrix.arch) &&
              steps.prepare_record.outputs.cycle_2 == 'true' }}
        run: >-
          bash benchmarks/comparison/record-cycle-linux.sh
          --arch "${{ matrix.arch }}" --cycle 2
          --seeds "${{ inputs.record_seeds }}" --record-root "${RECORD_ROOT}"
      - name: Upload cycle 2 checkpoint
        if: >-
          ${{ always() && (inputs.record_arch == 'all' || inputs.record_arch == matrix.arch) &&
              steps.prepare_record.outcome == 'success' && steps.record_cycle_2.outcome != 'skipped' &&
              steps.prepare_record.outputs.cycle_2 == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: comparison-record-${{ matrix.arch }}-cycle2-attempt${{ github.run_attempt }}
          path: |
            ${{ env.RECORD_ROOT }}/comparison-v1-${{ matrix.arch }}-cycle2-seed*.json
            ${{ env.RECORD_ROOT }}/summary-v1-${{ matrix.arch }}-cycle2.json
            ${{ env.RECORD_ROOT }}/runner-doctor-${{ matrix.arch }}.json
          if-no-files-found: error
      - name: Record or resume cycle 3
        id: record_cycle_3
        if: >-
          ${{ success() && (inputs.record_arch == 'all' || inputs.record_arch == matrix.arch) &&
              steps.prepare_record.outputs.cycle_3 == 'true' }}
        run: >-
          bash benchmarks/comparison/record-cycle-linux.sh
          --arch "${{ matrix.arch }}" --cycle 3
          --seeds "${{ inputs.record_seeds }}" --record-root "${RECORD_ROOT}"
      - name: Upload cycle 3 checkpoint
        if: >-
          ${{ always() && (inputs.record_arch == 'all' || inputs.record_arch == matrix.arch) &&
              steps.prepare_record.outcome == 'success' && steps.record_cycle_3.outcome != 'skipped' &&
              steps.prepare_record.outputs.cycle_3 == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: comparison-record-${{ matrix.arch }}-cycle3-attempt${{ github.run_attempt }}
          path: |
            ${{ env.RECORD_ROOT }}/comparison-v1-${{ matrix.arch }}-cycle3-seed*.json
            ${{ env.RECORD_ROOT }}/summary-v1-${{ matrix.arch }}-cycle3.json
            ${{ env.RECORD_ROOT }}/runner-doctor-${{ matrix.arch }}.json
          if-no-files-found: error
      - name: Enforce cycle stability
        if: >-
          ${{ success() && inputs.record_finalize &&
              (inputs.record_arch == 'all' || inputs.record_arch == matrix.arch) }}
        shell: bash
        run: |
          set -uo pipefail
          output="${RECORD_ROOT}/stability-v1-${{ matrix.arch }}.json"
          temporary="${output}.tmp"
          rm -f "${output}" "${temporary}"
          set +e
          cargo run --locked --release -p tysel-bench-compare --bin tysel-bench-stability -- \
            --input "${RECORD_ROOT}/summary-v1-${{ matrix.arch }}-cycle1.json" \
            "${RECORD_ROOT}/summary-v1-${{ matrix.arch }}-cycle2.json" \
            "${RECORD_ROOT}/summary-v1-${{ matrix.arch }}-cycle3.json" \
            --output "${temporary}" \
            --fail-on-unstable
          status=$?
          set -e
          if [[ -s "${temporary}" ]]; then
            mv "${temporary}" "${output}"
          fi
          exit "${status}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: >-
          ${{ always() && (inputs.record_arch == 'all' || inputs.record_arch == matrix.arch) &&
              steps.prepare_record.outcome == 'success' }}
        with:
          name: comparison-record-${{ matrix.arch }}-snapshot-attempt${{ github.run_attempt }}
          path: |
            ${{ env.RECORD_ROOT }}/comparison-v1-${{ matrix.arch }}-cycle*-seed*.*
            ${{ env.RECORD_ROOT }}/summary-v1-${{ matrix.arch }}-cycle*.*
            ${{ env.RECORD_ROOT }}/stability-v1-${{ matrix.arch }}.json
            ${{ env.RECORD_ROOT }}/runner-doctor-${{ matrix.arch }}.json
          if-no-files-found: error
