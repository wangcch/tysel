name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tysel
          POSTGRES_PASSWORD: tysel
          POSTGRES_DB: tysel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tysel -d tysel"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TYSEL_POSTGRES_TEST_URL: postgres://tysel:tysel@127.0.0.1:5432/tysel
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - name: Verify runtime SBOM inventory is current
        run: cargo run --locked -p tysel-build --bin tysel-supply-chain -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets

  rust-msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2
      - run: cargo audit --deny warnings
      - run: cargo deny check

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly-2026-08-15
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz@0.13.2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz -> target
      - name: Run bounded security fuzz smoke suite
        run: |
          for target in tap_decode manifest_parse isolate_ipc task_rpc release_metadata; do
            cargo fuzz run "$target" -- -runs=10000 -timeout=10 -rss_limit_mb=4096
          done

  component-host-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p tysel-engine-wasm --all-targets

  # Landlock, seccomp allowlist, and isolate workers are Linux-only.
  # x86_64 coverage comes from the rust job. One arm64 runner covers both
  # the component host and architecture-specific sandbox syscall tables.
  rust-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p tysel-engine-wasm --all-targets
      - run: cargo test -p tysel-isolate --all-targets
      - run: cargo test -p tysel-cap-fs --all-targets

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm check

  component-sdk-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: 1.25.5
          cache-dependency-path: |
            sdk/component-go/go.mod
            sdk/examples/go-echo/go.sum
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: go test ./...
        working-directory: sdk/component-go
      - run: go install github.com/bytecodealliance/componentize-go@v0.4.1
      - run: componentize-go -d ../../../wit/component -w task build -o echo.component.wasm
        working-directory: sdk/examples/go-echo
      - run: >-
          cargo test -p tysel-engine-wasm --test sdk_fixtures
          go_sdk_fixture_matches_the_host_contract_with_restricted_wasi
          -- --exact --ignored
        env:
          TYSEL_GO_COMPONENT_FIXTURE: sdk/examples/go-echo/echo.component.wasm

  component-sdk-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: bytecodealliance/actions/wasm-tools/setup@v1
        with:
          version: "1.247.0"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            sdk/examples/rust-echo -> target
      - run: >-
          cargo build --manifest-path sdk/examples/rust-echo/Cargo.toml
          --target wasm32-unknown-unknown --release
      - run: >-
          wasm-tools component new
          sdk/examples/rust-echo/target/wasm32-unknown-unknown/release/tysel_rust_echo_component.wasm
          -o sdk/examples/rust-echo/target/echo.component.wasm
      - run: >-
          cargo test -p tysel-engine-wasm --test sdk_fixtures
          rust_sdk_fixture_matches_the_host_contract
          -- --exact --ignored
        env:
          TYSEL_RUST_COMPONENT_FIXTURE: sdk/examples/rust-echo/target/echo.component.wasm

  # Roadmap §30 idle PSS is Linux-only. macOS RSS from tysel-bench is a proxy.
  linux-pss:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build packaged runtime stub
        run: cargo build -p tysel-runtime --bin tysel-service --release
      - name: Measure hello-service cold start, PSS, and artifact size
        run: >-
          cargo run -p tysel-testkit --bin tysel-bench --release --
          --evidence target/benchmark-evidence-linux-x64.json
          --source-commit ${{ github.sha }}
          --command "cargo run -p tysel-testkit --bin tysel-bench --release"
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-evidence-linux-x64
          path: target/benchmark-evidence-linux-x64.json
          if-no-files-found: error
