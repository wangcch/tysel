name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  FUZZ_TARGET: x86_64-unknown-linux-gnu
  FUZZ_TOOLCHAIN: nightly-2026-08-15
  MSRV_TOOLCHAIN: 1.95.0

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      full: ${{ steps.classify.outputs.full }}
      benchmark_required: ${{ steps.classify.outputs.benchmark_required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Classify changed files
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p target/ci-change-classification
          changed=target/ci-change-classification/changed-files.txt
          case "$EVENT_NAME" in
            pull_request)
              [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
              git cat-file -e "${BASE_SHA}^{commit}"
              git cat-file -e "${HEAD_SHA}^{commit}"
              git diff --no-renames --name-only "$BASE_SHA...$HEAD_SHA" > "$changed"
              ;;
            push)
              [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
              git cat-file -e "${HEAD_SHA}^{commit}"
              prior_runs_url="https://api.github.com/repos/${REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=100"
              validated_sha=
              if prior_runs="$(curl --fail --silent --show-error --retry 3 \
                --connect-timeout 10 --max-time 30 \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "$prior_runs_url")"; then
                validated_sha="$(jq -r \
                  '.workflow_runs | max_by(.created_at) | .head_sha // empty' \
                  <<< "$prior_runs")"
              fi
              if [[ "$validated_sha" =~ ^[0-9a-f]{40}$ ]] \
                && git cat-file -e "${validated_sha}^{commit}"; then
                echo "Comparing current main against last successful CI: $validated_sha"
                git diff --no-renames --name-only "$validated_sha" "$HEAD_SHA" > "$changed"
              else
                # Without a trustworthy validated base, reduced CI is unsafe.
                echo "No usable successful main CI baseline; forcing full validation"
                printf '%s\n' .github/workflows/ci.yml > "$changed"
              fi
              ;;
            *)
              echo "unsupported CI event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac
          LC_ALL=C sort -u -o "$changed" "$changed"
          echo "Changed files:"
          sed 's/^/  /' "$changed"
          bash .github/scripts/test-classify-ci-changes.sh
          bash .github/scripts/classify-ci-changes.sh "$changed" | tee -a "$GITHUB_OUTPUT"
      - name: Record change classification
        env:
          MODE: ${{ steps.classify.outputs.mode }}
          DOCS_ONLY: ${{ steps.classify.outputs.docs_only }}
          FULL: ${{ steps.classify.outputs.full }}
          BENCHMARK_REQUIRED: ${{ steps.classify.outputs.benchmark_required }}
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          jq -n \
            --arg mode "$MODE" \
            --arg sourceCommit "$SOURCE_COMMIT" \
            --argjson docsOnly "$DOCS_ONLY" \
            --argjson full "$FULL" \
            --argjson benchmarkRequired "$BENCHMARK_REQUIRED" \
            '{schemaVersion: 1, sourceCommit: $sourceCommit,
              mode: $mode, docsOnly: $docsOnly,
              full: $full, benchmarkRequired: $benchmarkRequired}' \
            > target/ci-change-classification/classification.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-change-classification
          path: target/ci-change-classification
          if-no-files-found: error
          retention-days: 7

  rust:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tysel
          POSTGRES_PASSWORD: tysel
          POSTGRES_DB: tysel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tysel -d tysel"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TYSEL_POSTGRES_TEST_URL: postgres://tysel:tysel@127.0.0.1:5432/tysel
      TYSEL_REDIS_TEST_URL: redis://127.0.0.1:6379/0
      TYSEL_REDIS_TEST_REQUIRED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build TypeScript SDK for application fixtures
        run: |
          pnpm --filter @tysel/types build
          pnpm --filter @tysel/sdk build
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all -- --check
      - name: Verify runtime SBOM inventory is current
        run: cargo run --locked -p tysel-build --bin tysel-supply-chain -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace --all-targets

  rust-msrv:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ env.MSRV_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        env:
          RUSTUP_TOOLCHAIN: ${{ env.MSRV_TOOLCHAIN }}
      - name: Check the workspace with the minimum supported Rust version
        env:
          RUSTUP_TOOLCHAIN: ${{ env.MSRV_TOOLCHAIN }}
        run: |
          rustc --version
          cargo check --locked --workspace --all-targets

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
      - uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f # v2
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2
      - run: cargo audit --deny warnings
      - run: cargo deny check

  fuzz-smoke:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ env.FUZZ_TOOLCHAIN }}
          targets: ${{ env.FUZZ_TARGET }}
      - uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f # v2
        with:
          tool: cargo-fuzz@0.13.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        env:
          CARGO_BUILD_TARGET: ${{ env.FUZZ_TARGET }}
          RUSTUP_TOOLCHAIN: ${{ env.FUZZ_TOOLCHAIN }}
        with:
          workspaces: fuzz -> target
      - name: Run bounded security fuzz smoke suite
        env:
          CARGO_BUILD_TARGET: ${{ env.FUZZ_TARGET }}
          RUSTUP_TOOLCHAIN: ${{ env.FUZZ_TOOLCHAIN }}
        run: |
          cargo metadata --locked --manifest-path fuzz/Cargo.toml \
            --format-version 1 --no-deps > /dev/null
          for target in tap_decode manifest_parse isolate_ipc task_rpc release_metadata; do
            cargo fuzz run --target "$FUZZ_TARGET" "$target" -- \
              -runs=10000 -timeout=10 -rss_limit_mb=4096
          done

  component-host-macos:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test --locked -p tysel-engine-wasm --all-targets

  # Landlock, seccomp allowlist, and isolate workers are Linux-only.
  # x86_64 coverage comes from the rust job. One arm64 runner covers both
  # the component host and architecture-specific sandbox syscall tables.
  rust-arm64:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test --locked -p tysel-engine-wasm --all-targets
      - run: cargo test --locked -p tysel-isolate --all-targets
      - run: cargo test --locked -p tysel-cap-fs --all-targets

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install documentation builder
        run: python3 -m pip install --requirement requirements-docs.txt
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm docs:build
      - run: pnpm test
      - name: Verify publishable TypeScript packages from an external consumer
        run: bash .github/scripts/test-types-package.sh

  component-sdk-go:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.25.5
          cache-dependency-path: |
            sdk/component-go/go.mod
            sdk/examples/go-echo/go.sum
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: go test ./...
        working-directory: sdk/component-go
      - run: go install github.com/bytecodealliance/componentize-go@v0.4.1
      - run: componentize-go -d ../../../wit/component -w task build -o echo.component.wasm
        working-directory: sdk/examples/go-echo
      - run: >-
          cargo test --locked -p tysel-engine-wasm --test sdk_fixtures
          go_sdk_fixture_matches_the_host_contract_with_restricted_wasi
          -- --exact --ignored
        env:
          TYSEL_GO_COMPONENT_FIXTURE: sdk/examples/go-echo/echo.component.wasm

  component-sdk-rust:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
      - uses: bytecodealliance/actions/wasm-tools/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1
        with:
          version: "1.247.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            . -> target
            sdk/examples/rust-echo -> target
      - run: >-
          cargo build --locked --manifest-path sdk/examples/rust-echo/Cargo.toml
          --target wasm32-unknown-unknown --release
      - run: >-
          wasm-tools component new
          sdk/examples/rust-echo/target/wasm32-unknown-unknown/release/tysel_rust_echo_component.wasm
          -o sdk/examples/rust-echo/target/echo.component.wasm
      - run: >-
          cargo test --locked -p tysel-engine-wasm --test sdk_fixtures
          rust_sdk_fixture_matches_the_host_contract
          -- --exact --ignored
        env:
          TYSEL_RUST_COMPONENT_FIXTURE: sdk/examples/rust-echo/target/echo.component.wasm

  # Roadmap §23 idle PSS is Linux-only. macOS RSS from tysel-bench is a proxy.
  linux-pss:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build packaged runtime stub
        run: cargo build --locked -p tysel-runtime --bin tysel-service --release
      - name: Build multi-suite benchmark runner
        run: >-
          cargo build --locked --release
          -p tysel-cli --bin tysel
          -p tysel-isolate --bin tysel-worker
      - name: Measure hello-service cold start, PSS, and artifact size
        run: >-
          cargo run --locked -p tysel-testkit --bin tysel-bench --release --
          --evidence target/benchmark-evidence-linux-x64.json
          --source-commit ${{ github.sha }}
          --command "cargo run --locked -p tysel-testkit --bin tysel-bench --release"
      - name: Measure isolate, task, durable, and HTTP suites
        run: >-
          target/release/tysel bench all
          --format json
          --evidence target/benchmark-evidence-v2-linux-x64.json
          --source-commit ${{ github.sha }}
          --command "target/release/tysel bench all --format json --evidence target/benchmark-evidence-v2-linux-x64.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-evidence-linux-x64
          path: |
            target/benchmark-evidence-linux-x64.json
            target/benchmark-evidence-v2-linux-x64.json
          if-no-files-found: error
          retention-days: 90

  gate:
    if: always()
    needs:
      - changes
      - rust
      - rust-msrv
      - security-audit
      - fuzz-smoke
      - component-host-macos
      - rust-arm64
      - javascript
      - component-sdk-go
      - component-sdk-rust
      - linux-pss
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every selected CI job to pass
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          jq -e '
            . as $needs
            | ["rust", "rust-msrv", "fuzz-smoke", "component-host-macos",
                "rust-arm64", "component-sdk-go", "component-sdk-rust",
                "linux-pss"] as $conditional
            | ($needs.changes.result == "success")
              and ($needs.javascript.result == "success")
              and ($needs["security-audit"].result == "success")
              and if $needs.changes.outputs.full == "true" then
                all($conditional[]; $needs[.].result == "success")
              elif $needs.changes.outputs.docs_only == "true" then
                all($conditional[]; $needs[.].result == "skipped")
              else
                false
              end
          ' <<< "$NEEDS_JSON" > /dev/null || {
            echo "CI jobs do not match the required change classification:" >&2
            jq -r 'to_entries[] | "  \(.key): \(.value.result)"' <<< "$NEEDS_JSON" >&2
            exit 1
          }
