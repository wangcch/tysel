name: release-linux

on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      runner:
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tysel
          POSTGRES_PASSWORD: tysel
          POSTGRES_DB: tysel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tysel -d tysel"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TYSEL_POSTGRES_TEST_URL: postgres://tysel:tysel@127.0.0.1:5432/tysel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build TypeScript SDK for application fixtures
        run: |
          pnpm --filter @tysel/types build
          pnpm --filter @tysel/sdk build
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Record deterministic build epoch
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
      - name: Run target production acceptance suite
        run: |
          python3 tests/acceptance/test_runner.py
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace --all-targets
      - name: Build and package two independent release trees
        shell: bash
        run: >-
          bash .github/scripts/package-release-target.sh
          "${{ inputs.target }}" "$SOURCE_DATE_EPOCH"
      - name: Install PostgreSQL acceptance client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Gate the exact release tools on deployment and crash recovery
        id: acceptance
        timeout-minutes: 20
        env:
          TYSEL_GATE_POSTGRES_URL: postgres://tysel:tysel@127.0.0.1:5432/tysel
        run: >-
          python3 tests/acceptance/run.py --suite release
          --bin-dir target/repro-1/release --profile release
          --target "${{ inputs.target }}" --require-build-commit
          --output target/deployment-acceptance
      - name: Retain release deployment acceptance diagnostics
        if: ${{ always() && steps.acceptance.outcome != 'skipped' && steps.acceptance.outcome != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployment-acceptance-${{ inputs.target }}
          path: target/deployment-acceptance
          if-no-files-found: error
          retention-days: 90
      - name: Run local installer fixture
        shell: bash
        run: |
          version="$(bash .github/scripts/check-version-sync.sh)"
          bash .github/scripts/test-installer.sh \
            "$version" "${{ inputs.target }}" target/release-output
      - name: Record target benchmark evidence
        env:
          TYSEL_STUB: target/repro-1/release/tysel-service
        run: >-
          cargo run --locked -p tysel-testkit --bin tysel-bench --release --
          --evidence target/release-output/benchmark-evidence-${{ inputs.target }}.json
          --source-commit ${{ github.sha }}
          --command "cargo run --locked -p tysel-testkit --bin tysel-bench --release"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-release-${{ inputs.target }}
          path: target/release-output/*
          if-no-files-found: error
