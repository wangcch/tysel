[package]
name = "tysel-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Tysel command-line interface"

[lints]
workspace = true

[[bin]]
name = "tysel"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
tokio.workspace = true
tysel-distribution.workspace = true
tysel-manifest.workspace = true
tysel-build.workspace = true
tysel-runtime = { path = "../tysel-runtime" }
tysel-engine.workspace = true
tysel-engine-qjs.workspace = true
tysel-observability.workspace = true
tysel-capability.workspace = true
tysel-cap-mcp.workspace = true
tysel-task-rpc.workspace = true
tysel-package.workspace = true
tysel-testkit = { path = "../tysel-testkit" }
notify = "6"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
semver.workspace = true
libc.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls"] }

[dev-dependencies]
wat = "1"
